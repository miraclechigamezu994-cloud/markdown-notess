<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

  <!-- PIN Lock Screen -->
  <div id="lock-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm text-center shadow-xl">
      <h2 class="text-xl font-bold text-sky-400 mb-2">🔒 QuickNotes Locked</h2>
      <p class="text-xs text-slate-400 mb-4">Enter your 4-digit PIN</p>
      <input type="password" id="pin-input" maxlength="4" class="w-32 text-center text-2xl tracking-widest bg-slate-950 border border-slate-700 rounded-lg py-2 mb-4 text-white focus:outline-none focus:border-sky-500" placeholder="••••">
      <button id="unlock-btn" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold w-full">Unlock</button>
      <p id="pin-error" class="text-red-400 text-xs mt-2 hidden">Incorrect PIN</p>
    </div>
  </div>

  <!-- App Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <h1 class="text-lg font-bold text-sky-400">📝 Notes</h1>
      <span id="save-status" class="text-xs text-emerald-400 font-medium hidden">Saved ✓</span>
    </div>
    <div class="flex items-center space-x-2">
      <button id="lock-toggle-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-medium">🔒 PIN</button>
      <button id="new-note-btn" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">+ New</button>
    </div>
  </header>

  <!-- Single View Body Container -->
  <main class="flex-1 flex flex-col overflow-hidden">
    
    <!-- Top Notes Selector / Horizontal List -->
    <section class="bg-slate-800/60 border-b border-slate-700 p-2 overflow-x-auto flex items-center space-x-2">
      <ul id="notes-list" class="flex space-x-2"></ul>
    </section>

    <!-- Formatting Toolbar -->
    <section class="bg-slate-800 border-b border-slate-700 p-2 flex space-x-2 overflow-x-auto text-xs">
      <button onclick="insertFormatting('bold')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded font-bold">B</button>
      <button onclick="insertFormatting('italic')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded italic">I</button>
      <button onclick="insertFormatting('big')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded font-semibold">Big Text</button>
      <button onclick="insertFormatting('small')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded">Small Text</button>
      <button onclick="insertFormatting('arrow')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded">➡️ Arrow</button>
      <button onclick="insertFormatting('list')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded">• Bullet</button>
    </section>

    <!-- Mode Tabs: Edit vs Preview -->
    <div class="flex border-b border-slate-800 bg-slate-900">
      <button id="tab-edit" class="flex-1 py-2 text-center text-xs font-semibold text-sky-400 border-b-2 border-sky-400">✏️ Write</button>
      <button id="tab-preview" class="flex-1 py-2 text-center text-xs font-semibold text-slate-400 border-b-2 border-transparent">👁️ View Formatted</button>
    </div>

    <!-- Main Editor & View Area -->
    <div class="flex-1 relative overflow-hidden bg-slate-950 p-3">
      <!-- Editor Area -->
      <textarea id="editor" class="w-full h-full bg-transparent text-slate-200 focus:outline-none font-mono text-sm resize-none" placeholder="Start writing..."></textarea>
      
      <!-- Single Preview View (Hidden by default) -->
      <div id="preview" class="w-full h-full overflow-y-auto prose prose-invert text-slate-200 hidden"></div>
    </div>

  </main>

  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const notesList = document.getElementById('notes-list');
    const newNoteBtn = document.getElementById('new-note-btn');
    const saveStatus = document.getElementById('save-status');
    const lockScreen = document.getElementById('lock-screen');
    const pinInput = document.getElementById('pin-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const pinError = document.getElementById('pin-error');
    const lockToggleBtn = document.getElementById('lock-toggle-btn');
    const tabEdit = document.getElementById('tab-edit');
    const tabPreview = document.getElementById('tab-preview');

    let notes = JSON.parse(localStorage.getItem('notes')) || [
      { id: Date.now(), title: 'My First Note', content: '# Welcome!\nUse formatting buttons above to customize your text.' }
    ];
    let activeNoteId = notes[0]?.id || null;
    let appPin = localStorage.getItem('app_pin') || null;

    if (appPin) lockScreen.classList.remove('hidden');

    unlockBtn.addEventListener('click', () => {
      if (pinInput.value === appPin) {
        lockScreen.classList.add('hidden');
        pinInput.value = '';
        pinError.classList.add('hidden');
      } else {
        pinError.classList.remove('hidden');
      }
    });

    lockToggleBtn.addEventListener('click', () => {
      if (appPin) {
        if (confirm("Remove PIN lock?")) {
          localStorage.removeItem('app_pin');
          appPin = null;
          lockToggleBtn.textContent = "🔒 PIN";
        }
      } else {
        const newPin = prompt("Enter a 4-digit PIN:");
        if (newPin && newPin.length === 4 && !isNaN(newPin)) {
          localStorage.setItem('app_pin', newPin);
          appPin = newPin;
          lockToggleBtn.textContent = "🔓 PIN";
        }
      }
    });

    if (appPin) lockToggleBtn.textContent = "🔓 PIN";

    // Mode Switcher (Write / View Tabs)
    tabEdit.addEventListener('click', () => {
      editor.classList.remove('hidden');
      preview.classList.add('hidden');
      tabEdit.className = "flex-1 py-2 text-center text-xs font-semibold text-sky-400 border-b-2 border-sky-400";
      tabPreview.className = "flex-1 py-2 text-center text-xs font-semibold text-slate-400 border-b-2 border-transparent";
    });

    tabPreview.addEventListener('click', () => {
      updatePreview();
      editor.classList.add('hidden');
      preview.classList.remove('hidden');
      tabPreview.className = "flex-1 py-2 text-center text-xs font-semibold text-sky-400 border-b-2 border-sky-400";
      tabEdit.className = "flex-1 py-2 text-center text-xs font-semibold text-slate-400 border-b-2 border-transparent";
    });

    function saveToStorage() {
      localStorage.setItem('notes', JSON.stringify(notes));
      saveStatus.classList.remove('hidden');
      setTimeout(() => saveStatus.classList.add('hidden'), 1500);
    }

    function renderNotesList() {
      notesList.innerHTML = '';
      notes.forEach(note => {
        const li = document.createElement('li');
        li.className = `px-3 py-1.5 rounded-lg text-xs whitespace-nowrap flex items-center space-x-1 cursor-pointer ${note.id === activeNoteId ? 'bg-sky-600 text-white font-medium' : 'bg-slate-700 text-slate-300'}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = note.title || 'Untitled';
        titleSpan.onclick = () => selectNote(note.id);

        const renameBtn = document.createElement('button');
        renameBtn.textContent = '✏️';
        renameBtn.onclick = (e) => {
          e.stopPropagation();
          const newTitle = prompt("Rename note:", note.title);
          if (newTitle) { note.title = newTitle; saveToStorage(); renderNotesList(); }
        };

        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑️';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          if (confirm("Delete note?")) deleteNote(note.id);
        };

        li.appendChild(titleSpan);
        li.appendChild(renameBtn);
        li.appendChild(delBtn);
        notesList.appendChild(li);
      });
    }

    function selectNote(id) {
      activeNoteId = id;
      const note = notes.find(n => n.id === id);
      if (note) {
        editor.value = note.content;
        updatePreview();
      }
      renderNotesList();
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      activeNoteId = notes.length > 0 ? notes[0].id : null;
      saveToStorage();
      if (activeNoteId) selectNote(activeNoteId);
      else { editor.value = ''; preview.innerHTML = ''; renderNotesList(); }
    }

    function updatePreview() {
      preview.innerHTML = marked.parse(editor.value || '');
    }

    function insertFormatting(type) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const text = editor.value;
      let selected = text.substring(start, end) || "text";

      let replacement = "";
      if (type === 'bold') replacement = `**${selected}**`;
      if (type === 'italic') replacement = `*${selected}*`;
      if (type === 'big') replacement = `# ${selected}`;
      if (type === 'small') replacement = `### ${selected}`;
      if (type === 'arrow') replacement = `➡️ ${selected}`;
      if (type === 'list') replacement = `- ${selected}`;

      editor.value = text.substring(0, start) + replacement + text.substring(end);
      editor.dispatchEvent(new Event('input'));
    }

    editor.addEventListener('input', () => {
      const activeNote = notes.find(n => n.id === activeNoteId);
      if (activeNote) {
        activeNote.content = editor.value;
        saveToStorage();
      }
    });

    newNoteBtn.addEventListener('click', () => {
      const newNote = { id: Date.now(), title: 'Untitled Note', content: '' };
      notes.unshift(newNote);
      saveToStorage();
      selectNote(newNote.id);
    });

    if (activeNoteId) selectNote(activeNoteId);
    else renderNotesList();
  </script>

</body>
</html>
